spring:
  datasource:
    url: jdbc:h2:mem:ecommerce_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop # tests build the schema from entities directly
    show-sql: false
  flyway:
    enabled: false # migrations target real PostgreSQL syntax; skip for H2 tests
